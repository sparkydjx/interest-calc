<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c6b52" />
    <meta
      name="description"
        content="Interest calculator for stocks, bonds, annuities, loans, and a cheap-car versus financed-car comparison. Works offline."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Interest" />
    <title>Interest Calculator</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div>
          <p class="eyebrow">Works offline</p>
          <h1>Interest</h1>
        </div>
        <button type="button" id="install" class="install" hidden>Install</button>
      </header>

      <nav class="tabs" role="tablist" aria-label="Calculator">
        <button type="button" class="tab" role="tab" id="tab-stocks" aria-controls="panel" aria-selected="true" data-mode="stocks">Stocks</button>
        <button type="button" class="tab" role="tab" id="tab-bonds" aria-controls="panel" aria-selected="false" data-mode="bonds" tabindex="-1">Bonds</button>
        <button type="button" class="tab" role="tab" id="tab-annuities" aria-controls="panel" aria-selected="false" data-mode="annuities" tabindex="-1">Annuities</button>
        <button type="button" class="tab" role="tab" id="tab-loans" aria-controls="panel" aria-selected="false" data-mode="loans" tabindex="-1">Loans</button>
        <button type="button" class="tab" role="tab" id="tab-cars" aria-controls="panel" aria-selected="false" data-mode="cars" tabindex="-1">Cars</button>
      </nav>

      <main id="panel" role="tabpanel" aria-labelledby="tab-stocks">
        <p id="blurb" class="blurb"></p>
        <form id="calc-form" novalidate></form>
        <p id="error" class="error" role="alert" hidden></p>
        <section id="results" class="results" aria-live="polite"></section>
      </main>

      <footer class="foot">
        <p>Estimates only. This is not financial, tax, or investment advice.</p>
      </footer>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
